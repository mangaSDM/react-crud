<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng</title>
    <script 
    src='https://unpkg.com/react@18/umd/react.development.js'></script> 
    <script src='https://unpkg.com/react-dom@18/umd/react-dom.development.js'></script> 
<script src='https://unpkg.com/@babel/standalone/babel.min.js'></script>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 24px;
        color: #222;
        background: #f8f9fa;
      }

      .app-container {
        max-width: 1100px;
        margin: 0 auto;
        background: #fff;
        padding: 20px 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        font-size: 24px;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      input[type="text"] {
        padding: 6px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }

      button {
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #f1f3f5;
        cursor: pointer;
        font-size: 14px;
      }

      button:hover {
        background: #e2e6ea;
      }

      .btn-primary {
        background: #0d6efd;
        color: #fff;
        border-color: #0d6efd;
      }

      .btn-primary:hover {
        background: #0b5ed7;
      }

      .btn-delete {
        background: #dc3545;
        color: #fff;
        border-color: #dc3545;
        margin-left: 6px;
      }

      .btn-delete:hover {
        background: #bb2d3b;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
        font-size: 14px;
      }

      th, td {
        border: 1px solid #dee2e6;
        padding: 8px 10px;
        text-align: left;
      }

      th {
        background: #f1f3f5;
        font-weight: 600;
      }

      tbody tr:hover {
        background: #f8f9fa;
      }

      /* Modal Overlay */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
      }

      /* Modal Content */
      .modal-content {
        background: #fff;
        padding: 18px 20px;
        border-radius: 6px;
        width: 340px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      }

      .modal-content h4 {
        margin-top: 0;
        margin-bottom: 12px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 10px;
      }

      .form-group label {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type= "text/babel">
      const INITIAL_USER = {
          name: "",
          username: "",
          email: "",
          address: { street: "", suite: "", city: "" },
          phone: "",
          website: ""
      };
      const ADDRESS_FIELDS = ["street", "suite", "city"];
      const USER_FIELDS = [
          { id: "name", label: "Name" },
          { id: "username", label: "Username" },
          { id: "email", label: "Email" },
          { id: "street", label: "Street" },
          { id: "suite", label: "Suite" },
          { id: "city", label: "City" },
          { id: "phone", label: "Phone" },
          { id: "website", label: "Website" }
      ];

      function updateUserField(prevUser, fieldId, value) {
          if (ADDRESS_FIELDS.includes(fieldId)) {
              return { ...prevUser, address: { ...(prevUser.address || {}), [fieldId]: value } };
          }
          return { ...prevUser, [fieldId]: value };
      }

      function UserFormFields({ userData, idPrefix, onFieldChange }) {
          return USER_FIELDS.map((field) => {
              const inputId = idPrefix ? `${idPrefix}-${field.id}` : field.id;
              const val = ADDRESS_FIELDS.includes(field.id)
                  ? (userData.address && userData.address[field.id]) || ""
                  : userData[field.id] || "";
              return (
                  <div className="form-group" key={field.id}>
                      <label htmlFor={inputId}>{field.label}: </label>
                      <input
                          id={inputId}
                          type="text"
                          value={val}
                          onChange={(e) => onFieldChange(field.id, e.target.value)}
                      />
                  </div>
              );
          });
      }

      function App() { 
          const [kw, setKw] = React.useState('');
          const [newUser, setNewUser] = React.useState(null);
          return (
            <div className="app-container">
              <h1>Quản lý người dùng</h1>
              <div className="toolbar">
                <SearchForm onChangeValue={setKw} />
                <AddUser onAddUser={setNewUser} />
              </div>
              <ResultTable kw={kw} newUser={newUser} onAdd = {() => setNewUser(null)}/>
            </div>
          );
      }
      function SearchForm({onChangeValue}) {
          return <div>
            <input type="text" placeholder="Nhập từ khóa" onChange={e => onChangeValue(e.target.value)} />
          </div>;
      }
      function ResultTable({kw, newUser, onAdd}) {
          const [users, setUsers] = React.useState([]);
          const [editing, setEditing] = React.useState(null);
          React.useEffect(() => { 
              fetch('https://jsonplaceholder.typicode.com/users')
                  .then(res => res.json())
                  .then(data => setUsers(data));
          }, []);

          React.useEffect(() => {
              if (newUser) {
                  setUsers((prev) => {
                      const nextId = prev.length > 0 ? Math.max(...prev.map((u) => u.id)) + 1 : 1;
                      return [...prev, { ...newUser, id: nextId }];
                  });
                  onAdd();
              }
          }, [newUser]);

          const editUser = (user) => {
              setEditing({ ...user, address: { ...(user.address || {}) } });
          };

          const handleEditChange = (fieldId, value) => {
              setEditing((prev) => (prev ? updateUserField(prev, fieldId, value) : prev));
          };

          const saveUser = () => {
              if (!editing) return;
              if (editing.name.trim() === "" || editing.username.trim() === "") {
                  alert("Vui lòng nhập Name và Username!");
                  return;
              }
              setUsers((prev) => prev.map((u) => (u.id === editing.id ? editing : u)));
              setEditing(null);
          };

          const removeUser = (id) => {
              setUsers((prev) => prev.filter((u) => u.id !== id));
              if (editing && editing.id === id) {
                  setEditing(null);
              }
          };

          const filteredUsers = users.filter(
              user =>
                  user.name.toLowerCase().includes(kw.toLowerCase()) ||
                  user.username.toLowerCase().includes(kw.toLowerCase())
          );
          return (
              <div>
                  {editing && (
                      <div className="modal-overlay">
                          <div className="modal-content">
                              <h4>Sửa người dùng</h4>
                              <UserFormFields
                                  userData={editing}
                                  idPrefix="edit"
                                  onFieldChange={handleEditChange}
                              />
                              <div className="modal-actions">
                                  <button className="btn-primary" onClick={saveUser}>Lưu</button>
                                  <button onClick={() => setEditing(null)}>Hủy</button>
                              </div>
                          </div>
                      </div>
                  )}
                  <table>
                      <thead>
                          <tr>
                              <th>ID</th>
                              <th>Name</th>
                              <th>Username</th>
                              <th>Email</th>
                              <th>Address</th>
                              <th>Phone</th>
                              <th>Actions</th>
                          </tr>
                      </thead>
                      <tbody>
                          {filteredUsers.map((u) => (
                              <tr key={u.id}>
                                  <td>{u.id}</td>
                                  <td>{u.name}</td>
                                  <td>{u.username}</td>
                                  <td>{u.email}</td>
                                  <td>
                                      {u.address.street}, {u.address.suite}, {u.address.city}
                                  </td>
                                  <td>{u.phone}</td>
                                  <td>
                                      <button onClick={() => editUser(u)}>Sửa</button>
                                      <button className="btn-delete" onClick={() => removeUser(u.id)}>Xóa</button>
                                  </td>
                              </tr>
                          ))}
                      </tbody>
                  </table>
              </div>
          );
      }

      function AddUser({onAddUser}) {
          const [adding, setAdding] = React.useState(false);
          const [user, setUser] = React.useState(INITIAL_USER);

          const handleFieldChange = (fieldId, value) => {
              setUser((prev) => updateUserField(prev, fieldId, value));
          };

          const handleAdd = () => {
              if (user.name.trim() === "" || user.username.trim() === "") {
                  alert("Vui lòng nhập Name và Username!");
                  return;
              }
              onAddUser(user);
              setUser(INITIAL_USER);
              setAdding(false);
          };

          const handleCancel = () => {
              setUser(INITIAL_USER);
              setAdding(false);
          };

          return (
              <div>
                  <button className="btn-primary" onClick={() => setAdding(true)}>Thêm</button>
                  {adding && (
                      <div className="modal-overlay">
                          <div className="modal-content">
                              <h4>Thêm người dùng</h4>
                              <UserFormFields
                                  userData={user}
                                  idPrefix="add"
                                  onFieldChange={handleFieldChange}
                              />
                              <div className="modal-actions">
                                  <button className="btn-primary" onClick={handleAdd}>Thêm</button>
                                  <button onClick={handleCancel}>Hủy</button>
                              </div>
                          </div>
                      </div>
                  )}
              </div>
          );
      }
          const root = ReactDOM.createRoot(document.getElementById('root')); 
          root.render(<App />);
    </script>
  </body>
</html>
